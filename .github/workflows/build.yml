
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B verify

      - name: Upload Paper/Bukkit JAR artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Paper-Bukkit-Build
          path: |
            **/target/*.jar
          if-no-files-found: error
          retention-days: 14

