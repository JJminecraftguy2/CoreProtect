name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build CoreProtect
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt of 4"

            if mvn -B -ntp verify; then
              echo "Build successful!"
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "Build failed. Retrying in ${delay} seconds..."
              sleep "$delay"
            fi
          done

          echo "Build failed after 4 attempts."
          exit 1

      - name: Upload Paper/Bukkit JAR artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Paper-Bukkit-Build
          path: |
            **/target/*.jar
            !**/target/original-*.jar
          if-no-files-found: error
          retention-days: 999
